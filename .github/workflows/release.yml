name: Cross-Platform Build and Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送以v开头的标签（如v1.0.0）

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            rid: win-x64
            extension: .exe
            platform: windows-amd64
          - os: ubuntu-latest
            rid: linux-x64
            extension: ''
            platform: linux-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }}  \
            -p:AssemblyName=agent-cli \
            -o publish/${{ matrix.rid }}

      - name: Create release artifacts
        run: |
          mkdir -p release
          BINARY_NAME="agent-cli-${{ env.VERSION }}-${{ matrix.platform }}${{ matrix.extension }}"
          cp publish/${{ matrix.rid }}/agent-cli${{ matrix.extension }} release/$BINARY_NAME
          LATEST_BINARY="agent-cli-${{ env.VERSION }}-${{ matrix.platform }}${{ matrix.extension }}"
          cp release/$BINARY_NAME release/$LATEST_BINARY
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false

      - name: Upload release assets
        run: |
          for file in $(find artifacts/ -type f); do
            asset_name=$(basename $file)
            gh release upload ${{ github.ref_name }} $file --clobber
            echo "Uploaded: $asset_name"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}